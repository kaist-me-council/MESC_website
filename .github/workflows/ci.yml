name: CI

# 병합 전 자동 검증. 이게 없던 동안 scripts/*.test.mjs 12개가 아무도 실행하지
# 않은 채 방치됐고, 유일한 게이트인 Vercel 빌드는 "병합 후"에야 돌았다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall 의 prisma generate 가 여기서 함께 돈다.
      - run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      # 오류는 병합을 막는다. 경고(React Compiler 계열 규칙 등)는 막지 않는다 — eslint.config.mjs 참고.
      - name: Lint
        run: npm run lint
